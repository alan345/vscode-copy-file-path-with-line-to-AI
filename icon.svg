<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B5CE6"/>
      <stop offset="0.55" stop-color="#5B3FE0"/>
      <stop offset="1" stop-color="#8B2FD6"/>
    </linearGradient>
    <linearGradient id="hl" x1="150" y1="248" x2="430" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- Editor card -->
  <rect x="84" y="104" width="344" height="304" rx="32" fill="#10162B" filter="url(#soft)"/>

  <!-- Gutter separator -->
  <line x1="156" y1="128" x2="156" y2="384" stroke="#2A3354" stroke-width="3"/>

  <!-- Gutter line numbers -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#5C678F" text-anchor="end">
    <text x="138" y="166">1</text>
    <text x="138" y="210">2</text>
    <text x="138" y="298">4</text>
    <text x="138" y="342">5</text>
  </g>

  <!-- Highlighted (clicked) line -->
  <rect x="100" y="232" width="296" height="44" rx="10" fill="url(#hl)" opacity="0.16"/>
  <rect x="100" y="232" width="6" height="44" rx="3" fill="url(#hl)"/>
  <text x="138" y="266" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" font-weight="800" fill="#FFD24A" text-anchor="end">3</text>

  <!-- Code lines (faux text) -->
  <g>
    <rect x="180" y="148" width="150" height="14" rx="7" fill="#3D6FE0"/>
    <rect x="180" y="192" width="210" height="14" rx="7" fill="#3A4670"/>
    <rect x="180" y="247" width="176" height="14" rx="7" fill="#8FB4FF"/>
    <rect x="180" y="291" width="120" height="14" rx="7" fill="#3A4670"/>
    <rect x="180" y="335" width="190" height="14" rx="7" fill="#3A4670"/>
  </g>

  <!-- Cursor / click pointer on the highlighted line number -->
  <g transform="translate(120 250)" filter="url(#soft)">
    <path d="M2 0 L2 40 L13 30 L21 47 L29 43 L21 26 L36 26 Z"
          fill="#FFFFFF" stroke="#10162B" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- AI sparkle -->
  <g transform="translate(372 150)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#FFD24A"/>
    <circle cx="30" cy="-26" r="6" fill="#FFFFFF"/>
    <circle cx="-28" cy="22" r="4" fill="#FFE9A8"/>
  </g>
</svg>
